backend:
  name: git-gateway
  branch: main

# Borradores: guardar no publica. Solo "Publicar" dispara un deploy en Netlify.
publish_mode: editorial_workflow

# Local development: cuando corres `npx decap-server` localmente,
# Decap usa este proxy en vez de git-gateway. En producción se ignora.
local_backend: true

media_folder: "public/assets/uploads"
public_folder: "/assets/uploads"

locale: "es"

site_url: https://inspirehubglobal.netlify.app
display_url: https://inspirehubglobal.netlify.app
logo_url: https://inspirehubglobal.netlify.app/assets/logos/logo-verde.png

collections:
  # ============ BLOG · ENSAYOS ============
  - name: "blog"
    label: "Ensayos · Blog"
    label_singular: "Ensayo"
    folder: "src/content/blog"
    create: true
    delete: true
    slug: "{{slug}}"
    summary: "{{title}} · {{date}}"
    sortable_fields: ["date", "title"]
    view_filters:
      - label: "Publicados"
        field: draft
        pattern: false
    fields:
      - { label: "Título principal", name: "title", widget: "string" }
      - { label: "Título en script (cursiva roja)", name: "titleScript", widget: "string", required: false, hint: "La parte del título que va con el estilo cursivo. Opcional." }
      - { label: "Categoría", name: "category", widget: "string", default: "Transición" }
      - { label: "Tiempo de lectura", name: "readTime", widget: "string", default: "6 min de lectura" }
      - { label: "Resumen (aparece al inicio)", name: "lead", widget: "text" }
      - { label: "Descripción SEO", name: "description", widget: "text", hint: "Lo que ve la gente en Google. Máx 160 caracteres." }
      - { label: "Imagen hero", name: "heroImage", widget: "image", required: false }
      - { label: "Texto alt de la imagen", name: "heroAlt", widget: "string", required: false }
      - { label: "Fecha", name: "date", widget: "date", format: "YYYY-MM-DD" }
      - { label: "Borrador (no publicado)", name: "draft", widget: "boolean", default: false }
      - { label: "Contenido del ensayo", name: "body", widget: "markdown" }

  # ============ PÁGINAS · COPY EDITABLE ============
  - name: "pages"
    label: "Páginas · Copy editable"
    label_singular: "Página"
    delete: false
    editor:
      preview: false
    files:
      # ---------- HOME ----------
      - name: "home"
        label: "Inicio · Home"
        file: "src/content/pages/home.md"
        fields:
          - { label: "SEO · Título (Google)", name: "title", widget: "string" }
          - { label: "SEO · Descripción (Google)", name: "description", widget: "text" }

          - label: "🏠 Hero (primera sección)"
            name: "hero"
            widget: "object"
            collapsed: true
            fields:
              - { label: "Eyebrow (texto chiquito arriba)", name: "eyebrow", widget: "string" }
              - { label: "Título · inicio", name: "titleStart", widget: "string" }
              - { label: "Título · script (cursiva roja)", name: "titleScript", widget: "string" }
              - { label: "Título · final", name: "titleEnd", widget: "string" }
              - { label: "Lead (párrafo grande)", name: "lead", widget: "text" }
              - { label: "Botón principal · texto", name: "ctaPrimaryText", widget: "string" }
              - { label: "Botón principal · link", name: "ctaPrimaryLink", widget: "string" }
              - { label: "Botón secundario · texto", name: "ctaSecondaryText", widget: "string" }
              - { label: "Botón secundario · link", name: "ctaSecondaryLink", widget: "string" }
              - { label: "Imagen Mabel", name: "image", widget: "image" }
              - { label: "Firma debajo de la foto", name: "signature", widget: "string" }

          - label: "📜 Marquee superior (frases rodando)"
            name: "marquee1Items"
            widget: "list"
            collapsed: true
            field: { label: "Frase", name: "text", widget: "string" }

          - label: "👤 Manifesto (Quién soy)"
            name: "manifesto"
            widget: "object"
            collapsed: true
            fields:
              - { label: "Eyebrow", name: "eyebrow", widget: "string" }
              - { label: "Título · inicio", name: "titleStart", widget: "string" }
              - { label: "Título · script", name: "titleScript", widget: "string" }
              - { label: "Título · final", name: "titleEnd", widget: "string" }
              - { label: "Lead", name: "lead", widget: "text" }
              - { label: "Párrafo 2", name: "p2", widget: "text" }
              - { label: "Párrafo 3 · inicio", name: "p3Start", widget: "text" }
              - { label: "Párrafo 3 · negrita", name: "p3Bold", widget: "string" }
              - { label: "Firma final", name: "signature", widget: "string" }
              - { label: "Imagen", name: "image", widget: "image" }

          - label: "🌱 Método ECO"
            name: "eco"
            widget: "object"
            collapsed: true
            fields:
              - { label: "Eyebrow", name: "eyebrow", widget: "string" }
              - { label: "Título · inicio", name: "titleStart", widget: "string" }
              - { label: "Título · script", name: "titleScript", widget: "string" }
              - { label: "Intro", name: "intro", widget: "text" }
              - label: "Los 3 movimientos"
                name: "movements"
                widget: "list"
                fields:
                  - { label: "Letra (E, C, O)", name: "letter", widget: "string" }
                  - { label: "Número (01, 02, 03)", name: "num", widget: "string" }
                  - { label: "Título", name: "title", widget: "string" }
                  - { label: "Tag corto", name: "tag", widget: "string" }
                  - { label: "Texto", name: "text", widget: "text" }

          - label: "💼 Servicios (3 cards)"
            name: "servicios"
            widget: "object"
            collapsed: true
            fields:
              - { label: "Título · inicio", name: "titleStart", widget: "string" }
              - { label: "Título · script", name: "titleScript", widget: "string" }
              - { label: "Título · final", name: "titleEnd", widget: "string" }
              - { label: "Lead", name: "lead", widget: "text" }
              - label: "Items"
                name: "items"
                widget: "list"
                fields:
                  - { label: "Número", name: "num", widget: "string" }
                  - { label: "Título", name: "title", widget: "string" }
                  - { label: "Subtítulo (for)", name: "for", widget: "string" }
                  - { label: "Meta (formatos)", name: "meta", widget: "string" }
                  - { label: "Cuerpo · inicio", name: "bodyStart", widget: "text" }
                  - { label: "Cuerpo · negrita", name: "bodyBold", widget: "string" }
                  - { label: "Cuerpo · final", name: "bodyEnd", widget: "text", required: false }
                  - { label: "Precio", name: "price", widget: "string" }
                  - { label: "Link", name: "link", widget: "string" }

          - label: "💬 Big Quote (frase grande con fondo rojo)"
            name: "bigQuote"
            widget: "object"
            collapsed: true
            fields:
              - { label: "Eyebrow", name: "eyebrow", widget: "string" }
              - { label: "Texto · inicio", name: "start", widget: "string" }
              - { label: "Texto · script", name: "script", widget: "string" }
              - { label: "Texto · final", name: "end", widget: "string" }
              - { label: "Atribución", name: "attribution", widget: "string" }

          - label: "🎖 Marquee credenciales (segundo)"
            name: "marquee2Items"
            widget: "list"
            collapsed: true
            fields:
              - { label: "Texto", name: "text", widget: "string" }
              - { label: "¿En script (cursiva)?", name: "isScript", widget: "boolean", default: false }

          - label: "💛 Testimonios"
            name: "testimonios"
            widget: "object"
            collapsed: true
            fields:
              - { label: "Eyebrow", name: "eyebrow", widget: "string" }
              - { label: "Título · inicio", name: "titleStart", widget: "string" }
              - { label: "Título · script", name: "titleScript", widget: "string" }
              - { label: "Título · final", name: "titleEnd", widget: "string" }
              - label: "Items"
                name: "items"
                widget: "list"
                fields:
                  - { label: "Foto", name: "photo", widget: "image" }
                  - { label: "Nombre", name: "name", widget: "string" }
                  - { label: "Rol / Profesión", name: "role", widget: "string" }
                  - { label: "Cita · inicio", name: "quoteStart", widget: "text" }
                  - { label: "Cita · negrita", name: "quoteBold", widget: "string" }
                  - { label: "Cita · final", name: "quoteEnd", widget: "text", required: false }

          - label: "🎙 Vitamina I (cross-promo podcast)"
            name: "vitamina"
            widget: "object"
            collapsed: true
            fields:
              - { label: "Eyebrow", name: "eyebrow", widget: "string" }
              - { label: "Título · inicio", name: "titleStart", widget: "string" }
              - { label: "Título · script", name: "titleScript", widget: "string" }
              - { label: "Título · final", name: "titleEnd", widget: "string" }
              - { label: "Texto · inicio", name: "textStart", widget: "text" }
              - { label: "Texto · negrita", name: "textBold", widget: "string" }
              - { label: "CTA texto", name: "ctaText", widget: "string" }

          - label: "📝 Sección Blog (header)"
            name: "blogSection"
            widget: "object"
            collapsed: true
            fields:
              - { label: "Eyebrow", name: "eyebrow", widget: "string" }
              - { label: "Título · inicio", name: "titleStart", widget: "string" }
              - { label: "Título · script", name: "titleScript", widget: "string" }
              - { label: "Título · final", name: "titleEnd", widget: "string" }

          - label: "🤝 Closing (CTA final)"
            name: "closing"
            widget: "object"
            collapsed: true
            fields:
              - { label: "Título · inicio", name: "titleStart", widget: "string" }
              - { label: "Título · script", name: "titleScript", widget: "string" }
              - { label: "Título · final", name: "titleEnd", widget: "string" }
              - { label: "Sub · inicio", name: "subStart", widget: "text" }
              - { label: "Sub · negrita", name: "subBold", widget: "string" }
              - { label: "Sub · final", name: "subEnd", widget: "text" }
              - { label: "Botón principal · texto", name: "ctaPrimaryText", widget: "string" }
              - { label: "Botón principal · link", name: "ctaPrimaryLink", widget: "string" }
              - { label: "Botón secundario · texto", name: "ctaSecondaryText", widget: "string" }
              - { label: "Botón secundario · link", name: "ctaSecondaryLink", widget: "string" }

      # ---------- SERVICIOS (overview) ----------
      - name: "servicios"
        label: "Servicios · Overview"
        file: "src/content/pages/servicios.md"
        fields:
          - { label: "SEO · Título (Google)", name: "title", widget: "string" }
          - { label: "SEO · Descripción (Google)", name: "description", widget: "text" }

          - { label: "Hero · Eyebrow", name: "heroEyebrow", widget: "string" }
          - { label: "Hero · Título inicio", name: "heroTitleStart", widget: "string" }
          - { label: "Hero · Título script", name: "heroTitleScript", widget: "string" }
          - { label: "Hero · Lead inicio", name: "heroLeadStart", widget: "text" }
          - { label: "Hero · Lead negrita", name: "heroLeadBold", widget: "string" }

          - label: "Servicios · 3 cards"
            name: "services"
            widget: "list"
            fields:
              - { label: "Número", name: "num", widget: "string" }
              - { label: "Título", name: "title", widget: "string" }
              - { label: "Tag", name: "tag", widget: "string" }
              - { label: "Cuerpo inicio", name: "bodyStart", widget: "text" }
              - { label: "Cuerpo negrita", name: "bodyBold", widget: "string" }
              - { label: "Cuerpo final", name: "bodyEnd", widget: "text", required: false }
              - label: "Meta items"
                name: "meta"
                widget: "list"
                field: { label: "Item", name: "item", widget: "string" }
              - { label: "Link texto", name: "linkText", widget: "string" }
              - { label: "Link", name: "link", widget: "string" }

          - { label: "Big Quote · Eyebrow", name: "bigQuoteEyebrow", widget: "string" }
          - { label: "Big Quote · Inicio", name: "bigQuoteStart", widget: "string" }
          - { label: "Big Quote · Script", name: "bigQuoteScript", widget: "string" }
          - { label: "Big Quote · Atribución", name: "bigQuoteAttribution", widget: "string" }

          - { label: "Vitamina · Eyebrow", name: "vitaminaEyebrow", widget: "string" }
          - { label: "Vitamina · Título inicio", name: "vitaminaTitleStart", widget: "string" }
          - { label: "Vitamina · Título script", name: "vitaminaTitleScript", widget: "string" }
          - { label: "Vitamina · Texto inicio", name: "vitaminaTextStart", widget: "text" }
          - { label: "Vitamina · Texto negrita", name: "vitaminaTextBold", widget: "string" }
          - { label: "Vitamina · CTA texto", name: "vitaminaCtaText", widget: "string" }

          - { label: "Closing · Título inicio", name: "closingTitleStart", widget: "string" }
          - { label: "Closing · Título script", name: "closingTitleScript", widget: "string" }
          - { label: "Closing · Título final", name: "closingTitleEnd", widget: "string" }
          - { label: "Closing · Sub inicio", name: "closingSubStart", widget: "text" }
          - { label: "Closing · Sub negrita", name: "closingSubBold", widget: "string" }
          - { label: "Closing · Sub final", name: "closingSubEnd", widget: "text", required: false }
          - { label: "Closing · Botón principal · texto", name: "closingCtaPrimaryText", widget: "string" }
          - { label: "Closing · Botón principal · link", name: "closingCtaPrimaryLink", widget: "string" }
          - { label: "Closing · Botón secundario · texto", name: "closingCtaSecondaryText", widget: "string" }
          - { label: "Closing · Botón secundario · link", name: "closingCtaSecondaryLink", widget: "string" }

      # ---------- CONTACTO ----------
      - name: "contacto"
        label: "Contacto"
        file: "src/content/pages/contacto.md"
        fields:
          - { label: "SEO · Título (Google)", name: "title", widget: "string" }
          - { label: "SEO · Descripción (Google)", name: "description", widget: "text" }

          - { label: "Hero · Eyebrow", name: "heroEyebrow", widget: "string" }
          - { label: "Hero · Título inicio", name: "heroTitleStart", widget: "string" }
          - { label: "Hero · Título script", name: "heroTitleScript", widget: "string" }
          - { label: "Hero · Lead inicio", name: "heroLeadStart", widget: "text" }
          - { label: "Hero · Lead negrita", name: "heroLeadBold", widget: "string" }

          - { label: "Form · Eyebrow", name: "formEyebrow", widget: "string" }
          - { label: "Form · Título inicio", name: "formTitleStart", widget: "string" }
          - { label: "Form · Título script", name: "formTitleScript", widget: "string" }
          - { label: "Form · Placeholder nombre", name: "formNombrePlaceholder", widget: "string" }
          - { label: "Form · Placeholder email", name: "formEmailPlaceholder", widget: "string" }
          - { label: "Form · Placeholder tema", name: "formTemaPlaceholder", widget: "string" }
          - label: "Form · Opciones del select"
            name: "formTemaOptions"
            widget: "list"
            fields:
              - { label: "Valor", name: "value", widget: "string" }
              - { label: "Etiqueta", name: "label", widget: "string" }
          - { label: "Form · Placeholder mensaje", name: "formMensajePlaceholder", widget: "text" }
          - { label: "Form · Texto del botón", name: "formSubmitText", widget: "string" }
          - { label: "Form · Texto pie", name: "formFineprint", widget: "string" }

          - { label: "Info · Email Mabel", name: "infoEmail", widget: "string" }
          - { label: "Info · Email label", name: "infoEmailLabel", widget: "string" }
          - { label: "Info · Call label", name: "infoCallLabel", widget: "string" }
          - { label: "Info · Call título inicio", name: "infoCallTitleStart", widget: "string" }
          - { label: "Info · Call título italic", name: "infoCallTitleEm", widget: "string" }
          - { label: "Info · Call texto inicio", name: "infoCallTextStart", widget: "text" }
          - { label: "Info · Call texto negrita", name: "infoCallTextBold", widget: "string" }
          - { label: "Info · Call texto final", name: "infoCallTextEnd", widget: "text" }
          - { label: "Info · Location label", name: "infoLocationLabel", widget: "string" }
          - { label: "Info · Location texto", name: "infoLocationText", widget: "text" }
