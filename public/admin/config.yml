backend:
  name: git-gateway
  branch: main

media_folder: "public/assets/uploads"
public_folder: "/assets/uploads"

locale: "es"

site_url: https://inspirehubglobal.com
display_url: https://inspirehubglobal.com
logo_url: https://inspirehubglobal.com/assets/logos/logo-verde.png

collections:
  # ============ BLOG · ENSAYOS ============
  - name: "blog"
    label: "Ensayos · Blog"
    label_singular: "Ensayo"
    folder: "src/content/blog"
    create: true
    delete: true
    slug: "{{slug}}"
    summary: "{{title}} · {{date}}"
    sortable_fields: ["date", "title"]
    view_filters:
      - label: "Publicados"
        field: draft
        pattern: false
    fields:
      - { label: "Título principal", name: "title", widget: "string" }
      - { label: "Título en script (cursiva roja)", name: "titleScript", widget: "string", required: false, hint: "La parte del título que va con el estilo cursivo. Opcional." }
      - { label: "Categoría", name: "category", widget: "string", default: "Transición" }
      - { label: "Tiempo de lectura", name: "readTime", widget: "string", default: "6 min de lectura" }
      - { label: "Resumen (aparece al inicio)", name: "lead", widget: "text" }
      - { label: "Descripción SEO", name: "description", widget: "text", hint: "Lo que ve la gente en Google. Máx 160 caracteres." }
      - { label: "Imagen hero", name: "heroImage", widget: "image", required: false }
      - { label: "Texto alt de la imagen", name: "heroAlt", widget: "string", required: false }
      - { label: "Fecha", name: "date", widget: "date", format: "YYYY-MM-DD" }
      - { label: "Borrador (no publicado)", name: "draft", widget: "boolean", default: false }
      - { label: "Contenido del ensayo", name: "body", widget: "markdown" }

  # ============ PÁGINAS · COPY EDITABLE ============
  - name: "pages"
    label: "Páginas · Copy editable"
    label_singular: "Página"
    delete: false
    editor:
      preview: false
    files:
      # ---------- HOME ----------
      - name: "home"
        label: "Inicio · Home"
        file: "src/content/pages/home.md"
        fields:
          - { label: "SEO · Título (Google)", name: "title", widget: "string" }
          - { label: "SEO · Descripción (Google)", name: "description", widget: "text", hint: "Máx 160 caracteres." }

          - { label: "Hero · Eyebrow", name: "heroEyebrow", widget: "string", hint: "Texto pequeño arriba del título principal." }
          - { label: "Hero · Título inicio", name: "heroTitleStart", widget: "string" }
          - { label: "Hero · Título en script", name: "heroTitleScript", widget: "string", hint: "La parte en cursiva roja." }
          - { label: "Hero · Título final", name: "heroTitleEnd", widget: "string" }
          - { label: "Hero · Lead", name: "heroLead", widget: "text" }
          - { label: "Hero · Botón principal · texto", name: "heroCtaPrimaryText", widget: "string" }
          - { label: "Hero · Botón principal · link", name: "heroCtaPrimaryLink", widget: "string" }
          - { label: "Hero · Botón secundario · texto", name: "heroCtaSecondaryText", widget: "string" }
          - { label: "Hero · Botón secundario · link", name: "heroCtaSecondaryLink", widget: "string" }
          - { label: "Hero · Imagen Mabel", name: "heroImage", widget: "image" }
          - { label: "Hero · Firma debajo de la foto", name: "heroSignature", widget: "string" }

          - label: "Marquee superior (frases rodando)"
            name: "marquee1Items"
            widget: "list"
            field: { label: "Frase", name: "text", widget: "string" }

          - { label: "Manifesto · Eyebrow", name: "manifestoEyebrow", widget: "string" }
          - { label: "Manifesto · Título inicio", name: "manifestoTitleStart", widget: "string" }
          - { label: "Manifesto · Título script", name: "manifestoTitleScript", widget: "string" }
          - { label: "Manifesto · Título final", name: "manifestoTitleEnd", widget: "string" }
          - { label: "Manifesto · Lead", name: "manifestoLead", widget: "text" }
          - { label: "Manifesto · Párrafo 2", name: "manifestoP2", widget: "text" }
          - { label: "Manifesto · Párrafo 3 inicio", name: "manifestoP3Start", widget: "text" }
          - { label: "Manifesto · Párrafo 3 negrita", name: "manifestoP3Bold", widget: "string" }
          - { label: "Manifesto · Firma final", name: "manifestoSignature", widget: "string" }
          - { label: "Manifesto · Imagen", name: "manifestoImage", widget: "image" }

          - { label: "Método ECO · Eyebrow", name: "ecoEyebrow", widget: "string" }
          - { label: "Método ECO · Título inicio", name: "ecoTitleStart", widget: "string" }
          - { label: "Método ECO · Título script", name: "ecoTitleScript", widget: "string" }
          - { label: "Método ECO · Intro", name: "ecoIntro", widget: "text" }
          - label: "Método ECO · Los 3 movimientos"
            name: "ecoMovements"
            widget: "list"
            fields:
              - { label: "Letra (E, C, O)", name: "letter", widget: "string" }
              - { label: "Número (01, 02, 03)", name: "num", widget: "string" }
              - { label: "Título", name: "title", widget: "string" }
              - { label: "Tag corto", name: "tag", widget: "string" }
              - { label: "Texto", name: "text", widget: "text" }

          - { label: "Servicios · Título inicio", name: "serviciosTitleStart", widget: "string" }
          - { label: "Servicios · Título script", name: "serviciosTitleScript", widget: "string" }
          - { label: "Servicios · Título final", name: "serviciosTitleEnd", widget: "string" }
          - { label: "Servicios · Lead", name: "serviciosLead", widget: "text" }
          - label: "Servicios · Los 3 cards"
            name: "services"
            widget: "list"
            fields:
              - { label: "Número", name: "num", widget: "string" }
              - { label: "Título", name: "title", widget: "string" }
              - { label: "Subtítulo (for)", name: "for", widget: "string" }
              - { label: "Meta (formatos)", name: "meta", widget: "string" }
              - { label: "Cuerpo inicio", name: "bodyStart", widget: "text" }
              - { label: "Cuerpo negrita", name: "bodyBold", widget: "string" }
              - { label: "Cuerpo final", name: "bodyEnd", widget: "text", required: false }
              - { label: "Precio", name: "price", widget: "string" }
              - { label: "Link", name: "link", widget: "string" }

          - { label: "Big Quote · Eyebrow", name: "bigQuoteEyebrow", widget: "string" }
          - { label: "Big Quote · Texto inicio", name: "bigQuoteStart", widget: "string" }
          - { label: "Big Quote · Texto script", name: "bigQuoteScript", widget: "string" }
          - { label: "Big Quote · Texto final", name: "bigQuoteEnd", widget: "string" }
          - { label: "Big Quote · Atribución", name: "bigQuoteAttribution", widget: "string" }

          - label: "Marquee credenciales"
            name: "marquee2Items"
            widget: "list"
            fields:
              - { label: "Texto", name: "text", widget: "string" }
              - { label: "¿En script (cursiva)?", name: "isScript", widget: "boolean", default: false }

          - { label: "Testimonios · Eyebrow", name: "testimoniosEyebrow", widget: "string" }
          - { label: "Testimonios · Título inicio", name: "testimoniosTitleStart", widget: "string" }
          - { label: "Testimonios · Título script", name: "testimoniosTitleScript", widget: "string" }
          - { label: "Testimonios · Título final", name: "testimoniosTitleEnd", widget: "string" }
          - label: "Testimonios"
            name: "testimonios"
            widget: "list"
            fields:
              - { label: "Foto", name: "photo", widget: "image" }
              - { label: "Nombre", name: "name", widget: "string" }
              - { label: "Rol / Profesión", name: "role", widget: "string" }
              - { label: "Cita inicio", name: "quoteStart", widget: "text" }
              - { label: "Cita negrita", name: "quoteBold", widget: "string" }
              - { label: "Cita final", name: "quoteEnd", widget: "text", required: false }

          - { label: "Vitamina · Eyebrow", name: "vitaminaEyebrow", widget: "string" }
          - { label: "Vitamina · Título inicio", name: "vitaminaTitleStart", widget: "string" }
          - { label: "Vitamina · Título script", name: "vitaminaTitleScript", widget: "string" }
          - { label: "Vitamina · Título final", name: "vitaminaTitleEnd", widget: "string" }
          - { label: "Vitamina · Texto inicio", name: "vitaminaTextStart", widget: "text" }
          - { label: "Vitamina · Texto negrita", name: "vitaminaTextBold", widget: "string" }
          - { label: "Vitamina · CTA texto", name: "vitaminaCtaText", widget: "string" }

          - { label: "Sección Blog · Eyebrow", name: "blogEyebrow", widget: "string" }
          - { label: "Sección Blog · Título inicio", name: "blogTitleStart", widget: "string" }
          - { label: "Sección Blog · Título script", name: "blogTitleScript", widget: "string" }
          - { label: "Sección Blog · Título final", name: "blogTitleEnd", widget: "string" }

          - { label: "Closing · Título inicio", name: "closingTitleStart", widget: "string" }
          - { label: "Closing · Título script", name: "closingTitleScript", widget: "string" }
          - { label: "Closing · Título final", name: "closingTitleEnd", widget: "string" }
          - { label: "Closing · Sub inicio", name: "closingSubStart", widget: "text" }
          - { label: "Closing · Sub negrita", name: "closingSubBold", widget: "string" }
          - { label: "Closing · Sub final", name: "closingSubEnd", widget: "text" }
          - { label: "Closing · Botón principal · texto", name: "closingCtaPrimaryText", widget: "string" }
          - { label: "Closing · Botón principal · link", name: "closingCtaPrimaryLink", widget: "string" }
          - { label: "Closing · Botón secundario · texto", name: "closingCtaSecondaryText", widget: "string" }
          - { label: "Closing · Botón secundario · link", name: "closingCtaSecondaryLink", widget: "string" }

      # ---------- SERVICIOS (overview) ----------
      - name: "servicios"
        label: "Servicios · Overview"
        file: "src/content/pages/servicios.md"
        fields:
          - { label: "SEO · Título (Google)", name: "title", widget: "string" }
          - { label: "SEO · Descripción (Google)", name: "description", widget: "text" }

          - { label: "Hero · Eyebrow", name: "heroEyebrow", widget: "string" }
          - { label: "Hero · Título inicio", name: "heroTitleStart", widget: "string" }
          - { label: "Hero · Título script", name: "heroTitleScript", widget: "string" }
          - { label: "Hero · Lead inicio", name: "heroLeadStart", widget: "text" }
          - { label: "Hero · Lead negrita", name: "heroLeadBold", widget: "string" }

          - label: "Servicios · 3 cards"
            name: "services"
            widget: "list"
            fields:
              - { label: "Número", name: "num", widget: "string" }
              - { label: "Título", name: "title", widget: "string" }
              - { label: "Tag", name: "tag", widget: "string" }
              - { label: "Cuerpo inicio", name: "bodyStart", widget: "text" }
              - { label: "Cuerpo negrita", name: "bodyBold", widget: "string" }
              - { label: "Cuerpo final", name: "bodyEnd", widget: "text", required: false }
              - label: "Meta items"
                name: "meta"
                widget: "list"
                field: { label: "Item", name: "item", widget: "string" }
              - { label: "Link texto", name: "linkText", widget: "string" }
              - { label: "Link", name: "link", widget: "string" }

          - { label: "Big Quote · Eyebrow", name: "bigQuoteEyebrow", widget: "string" }
          - { label: "Big Quote · Inicio", name: "bigQuoteStart", widget: "string" }
          - { label: "Big Quote · Script", name: "bigQuoteScript", widget: "string" }
          - { label: "Big Quote · Atribución", name: "bigQuoteAttribution", widget: "string" }

          - { label: "Vitamina · Eyebrow", name: "vitaminaEyebrow", widget: "string" }
          - { label: "Vitamina · Título inicio", name: "vitaminaTitleStart", widget: "string" }
          - { label: "Vitamina · Título script", name: "vitaminaTitleScript", widget: "string" }
          - { label: "Vitamina · Texto inicio", name: "vitaminaTextStart", widget: "text" }
          - { label: "Vitamina · Texto negrita", name: "vitaminaTextBold", widget: "string" }
          - { label: "Vitamina · CTA texto", name: "vitaminaCtaText", widget: "string" }

          - { label: "Closing · Título inicio", name: "closingTitleStart", widget: "string" }
          - { label: "Closing · Título script", name: "closingTitleScript", widget: "string" }
          - { label: "Closing · Título final", name: "closingTitleEnd", widget: "string" }
          - { label: "Closing · Sub inicio", name: "closingSubStart", widget: "text" }
          - { label: "Closing · Sub negrita", name: "closingSubBold", widget: "string" }
          - { label: "Closing · Sub final", name: "closingSubEnd", widget: "text", required: false }
          - { label: "Closing · Botón principal · texto", name: "closingCtaPrimaryText", widget: "string" }
          - { label: "Closing · Botón principal · link", name: "closingCtaPrimaryLink", widget: "string" }
          - { label: "Closing · Botón secundario · texto", name: "closingCtaSecondaryText", widget: "string" }
          - { label: "Closing · Botón secundario · link", name: "closingCtaSecondaryLink", widget: "string" }

      # ---------- SOBRE MABEL ----------
      - name: "sobre-mabel"
        label: "Sobre Mabel"
        file: "src/content/pages/sobre-mabel.md"
        fields:
          - { label: "SEO · Título (Google)", name: "title", widget: "string" }
          - { label: "SEO · Descripción (Google)", name: "description", widget: "text" }

          - { label: "Hero · Imagen", name: "heroImage", widget: "image" }
          - { label: "Hero · Eyebrow", name: "heroEyebrow", widget: "string" }
          - { label: "Hero · Título inicio", name: "heroTitleStart", widget: "string" }
          - { label: "Hero · Título script", name: "heroTitleScript", widget: "string" }
          - { label: "Hero · Lead", name: "heroLead", widget: "text" }
          - { label: "Hero · Párrafo 2", name: "heroP2", widget: "text" }
          - { label: "Hero · Párrafo 3 inicio", name: "heroP3Start", widget: "text" }
          - { label: "Hero · Párrafo 3 negrita", name: "heroP3Bold", widget: "string" }
          - { label: "Hero · Firma final", name: "heroSignature", widget: "string" }

          - { label: "Con quién trabajo · Eyebrow", name: "audienceEyebrow", widget: "string" }
          - { label: "Con quién trabajo · Título inicio", name: "audienceTitleStart", widget: "string" }
          - { label: "Con quién trabajo · Título script", name: "audienceTitleScript", widget: "string" }
          - { label: "Con quién trabajo · Intro", name: "audienceIntro", widget: "text" }
          - label: "Con quién trabajo · Items (3)"
            name: "audienceItems"
            widget: "list"
            fields:
              - { label: "Número", name: "num", widget: "string" }
              - { label: "Etiqueta", name: "label", widget: "string" }
              - { label: "Título", name: "title", widget: "string" }
              - { label: "Tag", name: "tag", widget: "string" }
              - { label: "Texto", name: "text", widget: "text" }
          - { label: "Con quién trabajo · Foot inicio", name: "audienceFootStart", widget: "text" }
          - { label: "Con quién trabajo · Foot negrita", name: "audienceFootBold", widget: "string" }

          - { label: "Cómo trabajo · Título inicio", name: "methodTitleStart", widget: "string" }
          - { label: "Cómo trabajo · Título script", name: "methodTitleScript", widget: "string" }
          - { label: "Cómo trabajo · Lead", name: "methodLead", widget: "text" }
          - label: "Cómo trabajo · Method cards"
            name: "methodCards"
            widget: "list"
            fields:
              - { label: "Letra", name: "letter", widget: "string" }
              - { label: "Título", name: "title", widget: "string" }
              - { label: "Para", name: "for", widget: "string" }
              - { label: "Meta", name: "meta", widget: "string" }
              - { label: "Texto (simple)", name: "text", widget: "text", required: false }
              - { label: "Texto inicio (con negrita)", name: "textStart", widget: "text", required: false }
              - { label: "Texto negrita", name: "textBold", widget: "string", required: false }
              - { label: "Texto final", name: "textEnd", widget: "text", required: false }
              - { label: "Link texto", name: "linkText", widget: "string" }
              - { label: "Link", name: "link", widget: "string" }

          - { label: "Credenciales · Eyebrow", name: "credEyebrow", widget: "string" }
          - { label: "Credenciales · Título inicio", name: "credTitleStart", widget: "string" }
          - { label: "Credenciales · Título script", name: "credTitleScript", widget: "string" }
          - label: "Credenciales · Lista"
            name: "credList"
            widget: "list"
            field: { label: "Credencial", name: "item", widget: "string" }

          - { label: "Big Quote · Eyebrow", name: "bigQuoteEyebrow", widget: "string" }
          - { label: "Big Quote · Inicio", name: "bigQuoteStart", widget: "string" }
          - { label: "Big Quote · Script", name: "bigQuoteScript", widget: "string" }
          - { label: "Big Quote · Atribución", name: "bigQuoteAttribution", widget: "string" }

          - { label: "Vitamina · Eyebrow", name: "vitaminaEyebrow", widget: "string" }
          - { label: "Vitamina · Título inicio", name: "vitaminaTitleStart", widget: "string" }
          - { label: "Vitamina · Título script", name: "vitaminaTitleScript", widget: "string" }
          - { label: "Vitamina · Título final", name: "vitaminaTitleEnd", widget: "string" }
          - { label: "Vitamina · Texto inicio", name: "vitaminaTextStart", widget: "text" }
          - { label: "Vitamina · Texto negrita", name: "vitaminaTextBold", widget: "string" }
          - { label: "Vitamina · CTA texto", name: "vitaminaCtaText", widget: "string" }

          - { label: "Closing · Título inicio", name: "closingTitleStart", widget: "string" }
          - { label: "Closing · Título script", name: "closingTitleScript", widget: "string" }
          - { label: "Closing · Título final", name: "closingTitleEnd", widget: "string" }
          - { label: "Closing · Sub inicio", name: "closingSubStart", widget: "text" }
          - { label: "Closing · Sub negrita", name: "closingSubBold", widget: "string" }
          - { label: "Closing · Sub final", name: "closingSubEnd", widget: "text" }
          - { label: "Closing · Botón principal · texto", name: "closingCtaPrimaryText", widget: "string" }
          - { label: "Closing · Botón principal · link", name: "closingCtaPrimaryLink", widget: "string" }
          - { label: "Closing · Botón secundario · texto", name: "closingCtaSecondaryText", widget: "string" }
          - { label: "Closing · Botón secundario · link", name: "closingCtaSecondaryLink", widget: "string" }
