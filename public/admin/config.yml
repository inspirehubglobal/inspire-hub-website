              - { label: "Texto final", name: "textEnd", widget: "text", required: false }
              - { label: "Link texto", name: "linkText", widget: "string" }
              - { label: "Link", name: "link", widget: "string" }

          - { label: "Credenciales · Eyebrow", name: "credEyebrow", widget: "string" }
          - { label: "Credenciales · Título inicio", name: "credTitleStart", widget: "string" }
