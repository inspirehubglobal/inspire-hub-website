      # ---------- SERVICIOS · INDIVIDUAL ----------
      - name: "servicios-individual"
        label: "Servicios · Para ti"
        file: "src/content/pages/servicios-individual.md"
        fields:
          - { label: "SEO · Título", name: "title", widget: "string" }
          - { label: "SEO · Descripción", name: "description", widget: "text" }

